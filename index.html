<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <!-- Kiosk-friendly viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>CASH POT MEANINGS</title>

  <!-- Bump this number any time you change style.css to force refresh -->
  <link rel="stylesheet" href="style.css?v=35" />
</head>

<body>
  <!-- Force TREBUCHET + ALL CAPS for UI text (without touching style.css) -->
  <main
    id="app"
    class="app"
    style="font-family:'Trebuchet MS', Trebuchet, Verdana, sans-serif; text-transform:uppercase;"
  >

    <!-- GRID VIEW -->
    <section id="gridView" class="view view--active">
      <header class="topbar">
        <h1 class="title">SELECT A MEANING</h1>
      </header>

      <div id="grid" class="grid"></div>
    </section>

    <!-- CARD VIEW -->
    <section id="cardView" class="view">
      <header class="topbar topbar--nav">

        <!-- Keep existing IDs (app.js uses these) -->
        <button id="btnBack" class="navbtn" type="button" aria-label="BACK TO GRID">
          BACK
        </button>

        <div class="counter" aria-label="CARD COUNT">
          <span id="counterNum">01</span> / 36
        </div>

        <div class="navbtn-group" aria-label="CARD NAVIGATION">
          <button id="btnPrev" class="navbtn" type="button" aria-label="PREVIOUS CARD">PREV</button>
          <button id="btnNext" class="navbtn" type="button" aria-label="NEXT CARD">NEXT</button>
        </div>

      </header>

      <div class="cardStage">

  <button id="arrowLeft" class="cardArrow cardArrow--left" type="button">
    &#10094;
  </button>

  <img id="cardImage" class="cardImage" alt="MEANING CARD" />

  <button id="arrowRight" class="cardArrow cardArrow--right" type="button">
    &#10095;
  </button>

</div>

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
